name: Speaky
options:
  minimumXcodeGenVersion: "2.46.0"
  bundleIdPrefix: com.bedriyan
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "26.3"
  createIntermediateGroups: true

packages:
  SwiftWhisper:
    url: https://github.com/exPHAT/SwiftWhisper
    exactVersion: 1.2.0
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 1.17.0
  DynamicNotchKit:
    url: https://github.com/MrKai77/DynamicNotchKit
    exactVersion: 1.1.0
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: 0.13.2
targets:
  Speaky:
    type: application
    platform: macOS
    sources:
      - Speaky
      - path: Speaky/Resources/Speaky
        type: folder
      - path: Speaky/Resources/Sounds
        type: folder
    settings:
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: true
          PRODUCT_BUNDLE_IDENTIFIER: com.bedriyan.speaky.debug
          PRODUCT_NAME: Speaky Debug
          CODE_SIGN_IDENTITY: "-"
        Release:
          ONLY_ACTIVE_ARCH: false
          PRODUCT_BUNDLE_IDENTIFIER: com.bedriyan.speaky
          PRODUCT_NAME: Speaky
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: false
      base:
        PRODUCT_MODULE_NAME: Speaky
        MARKETING_VERSION: "2.0.4"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        ARCHS: "arm64 x86_64"
        CODE_SIGN_ENTITLEMENTS: Speaky/Resources/Speaky.entitlements
        INFOPLIST_FILE: Speaky/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: true
        OTHER_SWIFT_FLAGS: ""
        GENERATE_INFOPLIST_FILE: false
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
    dependencies:
      - package: SwiftWhisper
      - package: KeyboardShortcuts
      - package: DynamicNotchKit
      - package: FluidAudio
      - sdk: CoreAudio.framework
      - sdk: AudioToolbox.framework
      - sdk: Security.framework
      - sdk: Carbon.framework

    entitlements:
      path: Speaky/Resources/Speaky.entitlements
      properties:
        com.apple.security.device.audio-input: true

  SpeakyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - SpeakyTests
    settings:
      configs:
        Debug:
          TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Speaky Debug.app/Contents/MacOS/Speaky Debug"
          BUNDLE_LOADER: "$(TEST_HOST)"
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bedriyan.speaky.tests
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: Speaky

schemes:
  Speaky:
    build:
      targets:
        Speaky: all
        SpeakyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SpeakyTests
